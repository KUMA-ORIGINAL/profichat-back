
services:
  backend:
    build:
      context: app
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    restart: always
    expose:
      - 8000
    volumes:
      - ./app:/app
      - static_volume:/app/static
      - media_volume:/app/media
    # LiveKit работает в сети хоста (network_mode: host) — до него через host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:16
    env_file: .env.prod
    restart: unless-stopped
    volumes:
      - database-storage:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    # тег закреплён (раньше — плавающий latest); staging использует тот же. Перед деплоем сверить
    # с работающей версией: Redis не читает RDB более новой версии (MESSENGER_MIGRATION.md, 0.7)
    image: redis:8.2
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --replicaof no one --maxmemory-policy noeviction
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5

  nginx:
    build: nginx
    env_file: .env.prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - certs:/etc/letsencrypt
    # LiveKit работает в сети хоста (network_mode: host) — до него через host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # default — прод-сервисы; edge — staging на этом же сервере (только при STAGING_DOMAIN в .env.prod,
    # MESSENGER_MIGRATION.md, раздел A). Без staging в edge никого нет, nginx работает как обычно.
    networks:
      - default
      - edge
    depends_on:
      - backend
      - centrifugo
      - minio

  centrifugo:
    image: centrifugo/centrifugo:v6.10.2
    restart: unless-stopped
    env_file:
      - .env.prod
    # Секреты берём из тех же переменных, что и backend (CENTRIFUGO_TOKEN_SECRET / CENTRIFUGO_API_KEY)
    entrypoint:
      - sh
      - -c
      - >-
        export CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY="$$CENTRIFUGO_TOKEN_SECRET"
        CENTRIFUGO_HTTP_API_KEY="$$CENTRIFUGO_API_KEY";
        unset CENTRIFUGO_TOKEN_SECRET CENTRIFUGO_API_KEY CENTRIFUGO_WS_URL CENTRIFUGO_API_URL;
        exec centrifugo --config /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    expose:
      - 8000
    depends_on:
      redis:
        condition: service_healthy

  minio:
    # Собирается локально из исходников (minio/Dockerfile): MinIO больше не публикует образы на Docker Hub.
    # Тег = релиз MinIO; при обновлении менять вместе с MINIO_RELEASE в minio/Dockerfile.
    build: minio
    image: profichat/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    env_file:
      - .env.prod
    # Корневые учётные данные = S3_ACCESS_KEY / S3_SECRET_KEY; S3_KMS_SECRET_KEY нужен для SSE-S3
    entrypoint:
      - sh
      - -c
      - >-
        export MINIO_ROOT_USER="$$S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$$S3_SECRET_KEY"
        MINIO_KMS_SECRET_KEY="$$S3_KMS_SECRET_KEY";
        exec minio server /data --console-address :9001
    volumes:
      - minio-data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'

  minio-init:
    # Тот же образ, что у minio (внутри есть mc)
    build: minio
    image: profichat/minio:RELEASE.2025-10-15T17-29-55Z
    env_file:
      - .env.prod
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 1; done;
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" &&
        mc encrypt set sse-s3 "local/$$S3_BUCKET"
    depends_on:
      - minio

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    env_file:
      - .env.prod
    # LIVEKIT_KEYS="<api_key>: <api_secret>" собирается из LIVEKIT_API_KEY / LIVEKIT_API_SECRET;
    # домен TURN подставляется из LIVEKIT_TURN_DOMAIN в копию конфига (обязателен), вебхуки — из LIVEKIT_WEBHOOK_URL
    entrypoint:
      - sh
      - -c
      - >-
        export LIVEKIT_KEYS="$$LIVEKIT_API_KEY: $$LIVEKIT_API_SECRET";
        sed "s|__LIVEKIT_TURN_DOMAIN__|$${LIVEKIT_TURN_DOMAIN:?LIVEKIT_TURN_DOMAIN is required}|" /etc/livekit.yaml > /tmp/livekit.yaml;
        if [ -n "$$LIVEKIT_WEBHOOK_URL" ]; then
        printf 'webhook:\n  api_key: %s\n  urls:\n    - %s\n' "$$LIVEKIT_API_KEY" "$$LIVEKIT_WEBHOOK_URL" >> /tmp/livekit.yaml;
        fi;
        exec /livekit-server --config /tmp/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build:
      context: app
      dockerfile: Dockerfile.prod
    command: celery -A config worker -l info
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - ./app:/app
    # LiveKit работает в сети хоста (network_mode: host) — до него через host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: app
      dockerfile: Dockerfile.prod
    command: celery -A config beat -l info
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - ./app:/app
    # LiveKit работает в сети хоста (network_mode: host) — до него через host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  # Сеть прод-nginx ↔ staging (docker-compose.staging.yml подключается к ней как к external).
  # Создаётся и принадлежит проду: прод-деплой не зависит от того, создана ли она вручную.
  # В неё входит ТОЛЬКО nginx — не подключайте сюда другие прод-сервисы: compose регистрирует
  # имя сервиса как DNS-имя в каждой сети, и общие имена (backend, centrifugo, minio, redis…)
  # из прода и staging смешались бы. Staging подключает сюда только сервисы staging-*.
  # PROFICHAT_EDGE_NETWORK — только для тестов.
  edge:
    name: ${PROFICHAT_EDGE_NETWORK:-profichat-edge}

volumes:
  database-storage:
  redis-data:
  minio-data:
  static_volume:
  media_volume:
  certs:
