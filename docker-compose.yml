
services:
  application:
    build: app
    env_file:
      - .env.dev
    restart: unless-stopped
    volumes:
      - ./app:/app
    ports:
      - '8000:8000'
    # LIVEKIT_API_URL=http://host.docker.internal:7880 — как в проде, где LiveKit в сети хоста
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: postgres:16
    env_file: .env.dev
    restart: unless-stopped
    ports:
      - '5555:5432'
    volumes:
      - database-storage:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    image: redis
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --replicaof no one --maxmemory-policy noeviction
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5

  centrifugo:
    image: centrifugo/centrifugo:v6.10.2
    restart: unless-stopped
    env_file:
      - .env.dev
    # Секреты берём из тех же переменных, что и backend (CENTRIFUGO_TOKEN_SECRET / CENTRIFUGO_API_KEY)
    entrypoint:
      - sh
      - -c
      - >-
        export CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY="$$CENTRIFUGO_TOKEN_SECRET"
        CENTRIFUGO_HTTP_API_KEY="$$CENTRIFUGO_API_KEY";
        unset CENTRIFUGO_TOKEN_SECRET CENTRIFUGO_API_KEY CENTRIFUGO_WS_URL CENTRIFUGO_API_URL;
        exec centrifugo --config /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - '8001:8000'
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    env_file:
      - .env.dev
    # Корневые учётные данные = S3_ACCESS_KEY / S3_SECRET_KEY; S3_KMS_SECRET_KEY нужен для SSE-S3
    entrypoint:
      - sh
      - -c
      - >-
        export MINIO_ROOT_USER="$$S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$$S3_SECRET_KEY"
        MINIO_KMS_SECRET_KEY="$$S3_KMS_SECRET_KEY";
        exec minio server /data --console-address :9001
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    env_file:
      - .env.dev
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 1; done;
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET" &&
        mc encrypt set sse-s3 "local/$$S3_BUCKET"
    depends_on:
      - minio

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    env_file:
      - .env.dev
    # LIVEKIT_KEYS="<api_key>: <api_secret>" собирается из LIVEKIT_API_KEY / LIVEKIT_API_SECRET;
    # домен TURN подставляется из LIVEKIT_TURN_DOMAIN в копию конфига, вебхуки — из LIVEKIT_WEBHOOK_URL
    entrypoint:
      - sh
      - -c
      - >-
        export LIVEKIT_KEYS="$$LIVEKIT_API_KEY: $$LIVEKIT_API_SECRET";
        sed "s|__LIVEKIT_TURN_DOMAIN__|$${LIVEKIT_TURN_DOMAIN:-turn.localhost}|" /etc/livekit.yaml > /tmp/livekit.yaml;
        if [ -n "$$LIVEKIT_WEBHOOK_URL" ]; then
        printf 'webhook:\n  api_key: %s\n  urls:\n    - %s\n' "$$LIVEKIT_API_KEY" "$$LIVEKIT_WEBHOOK_URL" >> /tmp/livekit.yaml;
        fi;
        exec /livekit-server --config /tmp/livekit.yaml --redis-host redis:6379 --node-ip 127.0.0.1
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
      - '3478:3478/udp'
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build: app
    command: celery -A config worker -l info
    env_file:
      - .env.dev
    restart: unless-stopped
    volumes:
      - ./app:/app
    # LIVEKIT_API_URL=http://host.docker.internal:7880 — как в проде, где LiveKit в сети хоста
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: app
    command: celery -A config beat -l info
    env_file:
      - .env.dev
    restart: unless-stopped
    volumes:
      - ./app:/app
    # LIVEKIT_API_URL=http://host.docker.internal:7880 — как в проде, где LiveKit в сети хоста
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  database-storage:
  redis-data:
  minio-data:
