upstream back {
    server backend:8000;
}

# DNS Docker. Необязательные сервисы мессенджера (centrifugo, minio) проксируются через переменную
# в proxy_pass: имя резолвится при запросе, а не при старте, поэтому nginx (и весь API) стартует,
# даже если такого контейнера сейчас нет, — эти location отвечают 502, пока сервис не поднимется.
# Статический upstream с недоступным именем валит nginx целиком: host not found in upstream.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Для WebSocket (LiveKit): Connection: upgrade только при Upgrade-запросе
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Запросы с чужим Host (сканеры, обращения по IP или по служебному имени VPS)
# обрываем здесь, чтобы они не доходили до Django и не порождали DisallowedHost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name $DOMAIN www.$DOMAIN;
    charset utf-8;
    client_max_body_size 10M;
    server_tokens off;

    # Есть сертификат — только ACME и 301 на https (http_redirect.conf); нет (первый запуск, dev) —
    # всё приложение по http (app_locations.conf), чтобы certbot мог получить сертификат.
    # Какой из двух — выбирает nginx_entrypoint.sh.
    include /etc/nginx/main-http.d/*.conf;
}

# Поддомены мессенджера по http: только проверка certbot (http-01), остальное — на https.
# Сами https-серверы files./rtc. и TURN/TLS на 443 — в tls_http.conf / tls_stream.conf,
# они подключаются entrypoint-ом, когда сертификат уже есть.
server {
    listen 80;
    listen [::]:80;
    server_name files.$DOMAIN rtc.$DOMAIN turn.$DOMAIN;
    server_tokens off;

    include /etc/nginx/snippets/http_redirect.conf;
}
