upstream back {
    server backend:8000;
}

# Centrifugo — WebSocket-доставка событий мессенджера
upstream centrifugo {
    server centrifugo:8000;
}

# Для WebSocket (LiveKit): Connection: upgrade только при Upgrade-запросе
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Запросы с чужим Host (сканеры, обращения по IP или по служебному имени VPS)
# обрываем здесь, чтобы они не доходили до Django и не порождали DisallowedHost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name $DOMAIN www.$DOMAIN;
    charset utf-8;
    client_max_body_size 10M;
    server_tokens off;

    include /etc/nginx/snippets/app_locations.conf;
}

# Поддомены мессенджера по http: только проверка certbot (http-01), остальное — на https.
# Сами https-серверы files./rtc. и TURN/TLS на 443 — в tls_http.conf / tls_stream.conf,
# они подключаются entrypoint-ом, когда сертификат уже есть.
server {
    listen 80;
    listen [::]:80;
    server_name files.$DOMAIN rtc.$DOMAIN turn.$DOMAIN;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
