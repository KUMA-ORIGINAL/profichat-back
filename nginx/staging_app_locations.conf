# Маршруты основного staging-домена (<STAGING_DOMAIN>), общие для http :80 и https.
# Аналог app_locations.conf, но всё — в контейнеры проекта profichat-staging через сеть
# profichat-edge. Только переменные в proxy_pass (resolver в nginx.conf): имя резолвится при
# запросе, поэтому прод-nginx стартует и работает, даже когда staging не запущен (тут 502).
# Подключается через include, без переменных окружения: envsubst этот файл не обрабатывает.

location / {
    set $staging_backend http://staging-backend:8000;
    proxy_pass $staging_backend;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Url-Scheme $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_redirect off;
}

# старый WebSocket (Django Channels)
location /ws/ {
    set $staging_backend http://staging-backend:8000;
    proxy_pass $staging_backend;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location /connection/websocket {
    set $staging_centrifugo http://staging-centrifugo:8000;
    proxy_pass $staging_centrifugo;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# тома static/media staging раздаёт контейнер staging-static (тома другого проекта сюда не смонтировать)
location /static/ {
    set $staging_static http://staging-static:80;
    proxy_pass $staging_static;
    expires 15d;
    access_log off;
}

location /media/ {
    set $staging_static http://staging-static:80;
    proxy_pass $staging_static;
    expires 7d;
    access_log off;
}
