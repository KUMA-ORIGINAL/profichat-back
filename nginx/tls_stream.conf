# Порт 443: маршрутизация по SNI без расшифровки (ssl_preread). Шаблон: nginx_entrypoint.sh
# подставляет ${DOMAIN} и кладёт результат в /etc/nginx/stream-conf.d/, когда сертификат уже есть.
#
#   turn.<DOMAIN>  → 127.0.0.1:5350 — TLS завершается здесь же (сертификат certbot), дальше
#                    обычный TCP в TURN-слушатель LiveKit (turn.tls_port 5349, external_tls: true).
#                    LiveKit сам объявляет клиентам turns:turn.<DOMAIN>:443?transport=tcp.
#   всё остальное  → 127.0.0.1:8443 — https-серверы из tls_http.conf.
#
# TURN/TLS на 443 нужен для мобильных сетей, где UDP и нестандартные порты закрыты.

map $ssl_preread_server_name $tls_backend {
    turn.${DOMAIN} 127.0.0.1:5350;
    # staging на этом же сервере (turn.<STAGING_DOMAIN> → 127.0.0.1:5351): файл кладёт
    # nginx_entrypoint.sh, только когда задан STAGING_DOMAIN и есть сертификат staging; иначе пусто
    include /etc/nginx/stream-map.d/*.map;
    default        127.0.0.1:8443;
}

# LiveKit в проде работает в network_mode: host (host.docker.internal = host-gateway).
upstream livekit_turn {
    server host.docker.internal:5349;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $tls_backend;
    # адрес клиента для внутренних серверов (real_ip в tls_http.conf)
    proxy_protocol on;
    proxy_timeout 1h;
}

server {
    listen 127.0.0.1:5350 ssl proxy_protocol;
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    proxy_pass livekit_turn;
    proxy_timeout 1h;
}
