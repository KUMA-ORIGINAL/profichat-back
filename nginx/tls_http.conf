# HTTPS-серверы. Шаблон: nginx_entrypoint.sh подставляет ${DOMAIN} и кладёт результат в
# /etc/nginx/conf.d/ только когда сертификат Let's Encrypt уже получен.
#
# Снаружи 443 слушает stream-сервер (tls_stream.conf): по SNI он отдаёт turn.<DOMAIN> в LiveKit
# TURN/TLS, а всё остальное — сюда, на внутренний 127.0.0.1:8443 с PROXY protocol
# (чтобы в $remote_addr и X-Forwarded-For был настоящий адрес клиента).

ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;

set_real_ip_from 127.0.0.1;
real_ip_header   proxy_protocol;

# LiveKit в проде работает в network_mode: host — до него идём через хост
# (host.docker.internal = host-gateway в docker-compose.prod.yml). Это имя берётся из /etc/hosts
# контейнера (extra_hosts) и есть всегда, даже когда LiveKit не запущен (тогда 502 на запрос),
# поэтому upstream статический: DNS Docker (resolver) записи extra_hosts не отдаёт.
upstream livekit {
    server host.docker.internal:7880;
}

# Неизвестный SNI/Host по https — обрываем, как и на :80.
server {
    listen 127.0.0.1:8443 ssl proxy_protocol default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name ${DOMAIN} www.${DOMAIN};
    charset utf-8;
    client_max_body_size 10M;
    server_tokens off;

    include /etc/nginx/snippets/app_locations.conf;
}

# Вложения мессенджера: presigned PUT/GET напрямую в MinIO. Подпись S3 считается на хост
# files.<DOMAIN>, поэтому Host передаётся как есть. Тело не буферизуется (видео до 200 МБ).
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name files.${DOMAIN};
    server_tokens off;
    # presigned-ссылка в query — пропуск к медицинскому файлу на час; в лог не пишем
    access_log off;

    ignore_invalid_headers off;
    client_max_body_size 200M;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        # адрес через переменную (resolver в nginx.conf): без minio nginx стартует, здесь будет 502;
        # proxy_pass с переменной без URI передаёт URI как есть (подпись S3 считается по нему)
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        chunked_transfer_encoding off;
    }
}

# Сигналинг звонков (LiveKit, wss).
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name rtc.${DOMAIN};
    server_tokens off;
    # токен комнаты LiveKit передаётся в query (?access_token=) — в лог не пишем
    access_log off;

    location / {
        proxy_pass http://livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
