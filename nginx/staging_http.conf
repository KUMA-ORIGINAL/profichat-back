# STAGING на этом же сервере, http :80. Шаблон: nginx_entrypoint.sh подставляет ${STAGING_DOMAIN}
# и кладёт результат в /etc/nginx/conf.d/ ТОЛЬКО когда в .env.prod задан STAGING_DOMAIN.
# Пусто — этого файла нет, конфиг прода тот же, что и без staging.
#
# Есть сертификат staging — :80 отдаёт только ACME и 301 на https (http_redirect.conf); нет —
# staging-приложение по http (staging_app_locations.conf), чтобы certbot мог его получить.

server {
    listen 80;
    listen [::]:80;
    server_name ${STAGING_DOMAIN};
    charset utf-8;
    client_max_body_size 10M;
    server_tokens off;

    include /etc/nginx/staging-main-http.d/*.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name files.${STAGING_DOMAIN} rtc.${STAGING_DOMAIN} turn.${STAGING_DOMAIN};
    server_tokens off;

    include /etc/nginx/snippets/http_redirect.conf;
}
