# STAGING, https-серверы на внутреннем 127.0.0.1:8443 (тот же, что у прода в tls_http.conf).
# Шаблон: nginx_entrypoint.sh подставляет ${STAGING_DOMAIN}; подключается, только когда задан
# STAGING_DOMAIN и есть ОБА сертификата — прода (443/stream и сам 127.0.0.1:8443 живут в
# tls_http.conf / tls_stream.conf) и отдельный staging (live/${STAGING_DOMAIN}).
# Сертификат задаётся в каждом server: на уровне http в tls_http.conf — прод-сертификат.
#
# Всё проксируется в контейнеры проекта profichat-staging (сеть profichat-edge) через переменные:
# без staging эти серверы отвечают 502, прод не затронут.

# LiveKit staging — в сети хоста на 17880 (livekit/livekit.staging.yaml). host.docker.internal
# есть всегда (extra_hosts), поэтому upstream статический, как у прода.
upstream livekit_staging {
    server host.docker.internal:17880;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name ${STAGING_DOMAIN};
    ssl_certificate     /etc/letsencrypt/live/${STAGING_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_DOMAIN}/privkey.pem;
    charset utf-8;
    client_max_body_size 10M;
    server_tokens off;

    include /etc/nginx/snippets/staging_app_locations.conf;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name files.${STAGING_DOMAIN};
    ssl_certificate     /etc/letsencrypt/live/${STAGING_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_DOMAIN}/privkey.pem;
    server_tokens off;
    # presigned-ссылки в query — в лог не пишем (как у прода)
    access_log off;

    ignore_invalid_headers off;
    client_max_body_size 200M;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        set $staging_minio http://staging-minio:9000;
        proxy_pass $staging_minio;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        chunked_transfer_encoding off;
    }
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name rtc.${STAGING_DOMAIN};
    ssl_certificate     /etc/letsencrypt/live/${STAGING_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_DOMAIN}/privkey.pem;
    server_tokens off;
    # токен комнаты в query — в лог не пишем (как у прода)
    access_log off;

    location / {
        proxy_pass http://livekit_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
