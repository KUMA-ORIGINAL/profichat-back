# Маршруты основного домена (общие для http :80 и https). Подключается через include,
# поэтому без переменных окружения: envsubst этот файл не обрабатывает.

location / {
    proxy_pass http://back;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Url-Scheme $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_redirect off;
}

location /ws/ {
    proxy_pass http://back/ws/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# WebSocket мессенджера (Centrifugo). Соединение живёт долго: сервер шлёт ping раз в 25 с.
location /connection/websocket {
    proxy_pass http://centrifugo;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

location /static/ {
    alias /app/static/;
    expires 15d;
    etag on;
    add_header Cache-Control "public, max-age=1296000, immutable";
    access_log off;
}

location /media/ {
    alias /app/media/;
    expires 7d;
    etag on;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
}
