# STAGING, TURN/TLS на 443. Шаблон: nginx_entrypoint.sh подставляет ${STAGING_DOMAIN}; условия —
# как у staging_tls_http.conf. Запись turn.${STAGING_DOMAIN} → 127.0.0.1:5351 в SNI-карту
# tls_stream.conf добавляет entrypoint (файл /etc/nginx/stream-map.d/staging.map).
#
# TLS завершается здесь (сертификат staging), дальше обычный TCP в TURN-слушатель staging-LiveKit
# (turn.tls_port 15349, external_tls: true; в сети хоста).

upstream livekit_turn_staging {
    server host.docker.internal:15349;
}

server {
    listen 127.0.0.1:5351 ssl proxy_protocol;
    ssl_certificate     /etc/letsencrypt/live/${STAGING_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    proxy_pass livekit_turn_staging;
    proxy_timeout 1h;
}
