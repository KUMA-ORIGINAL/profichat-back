# Ключи API передаются через переменную окружения LIVEKIT_KEYS="<api_key>: <api_secret>".
# Файл — шаблон: entrypoint в docker-compose подставляет __LIVEKIT_TURN_DOMAIN__, при заданном
# LIVEKIT_WEBHOOK_URL дописывает блок webhook и запускает копию в /tmp.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882   # один UDP-порт (mux) вместо диапазона
  use_external_ip: true
room:
  # комнаты создаёт только backend (start_call → create_room до выдачи токена): токен не может
  # «оживить» закрытую комнату завершённого звонка
  auto_create: false
redis:
  address: 127.0.0.1:6379
  db: 5
turn:
  enabled: true
  # LiveKit не стартует со включённым TURN без domain: подставляется из LIVEKIT_TURN_DOMAIN
  # (entrypoint в docker-compose; в проде turn.<DOMAIN>).
  domain: __LIVEKIT_TURN_DOMAIN__
  udp_port: 3478
  # TURN/TLS: TLS завершает nginx на 443 (stream + ssl_preread по SNI turn.<DOMAIN>, сертификат
  # certbot) и передаёт обычный TCP сюда. LiveKit объявляет клиентам turns:<domain>:443 независимо
  # от tls_port, поэтому tls_port — внутренний порт, наружу его открывать не нужно.
  tls_port: 5349
  external_tls: true

logging:
  level: info
